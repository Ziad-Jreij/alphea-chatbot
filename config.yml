version: "3.1"
recipe: default.v1
language: "en"

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: "char_wb"
    min_ngram: 1
    max_ngram: 4
  - name: LanguageModelFeaturizer
    model_name: "bert"
    model_weights: "bert-base-uncased"
  - name: DIETClassifier
    epochs: 120
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 60
  - name: FallbackClassifier
    threshold: 0.4
    ambiguity_threshold: 0.1

  - name: components.emotion.EmotionClassifierComponent

  - name: components.criticality.CriticalityZeroShotComponent
    model_name: "facebook/bart-large-mnli"   
    hypothesis_template: "This support request is {}."
    labels: ["low urgency", "medium urgency", "high urgency"]
    boost_from_emotion: true
    heuristics_enabled: true
    gpu: false     
    cache: true    

policies:
  - name: RulePolicy
    core_fallback_threshold: 0.6
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
  - name: MemoizationPolicy
    max_history: 5
  - name: TEDPolicy
    max_history: 5
    epochs: 50
    constrain_similarities: true

assistant_id: 20251018-162338-mean-crew
