<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Customer Service Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>html,body,#webchat{height:100%;margin:0;font-family:system-ui,Arial,sans-serif}</style>
</head>
<body>
  <div id="webchat"></div>

  <script>
    function boot() {
      if (!window.WebChat || !window.WebChat.default) {
        console.error("rasa-webchat not loaded");
        return;
      }
      console.log("rasa-webchat loaded, mounting…");
      // Use an explicit override if injected by the server, otherwise derive from
      // the current page origin so the widget works on any host (HTTP or HTTPS).
      const rasaUrl = window.__RASA_URL__ ||
        (window.location.protocol + "//" + window.location.hostname + ":5005");
      window.WebChat.default(
        {
          selector: "#webchat",
          initPayload: "/greet",
          socketUrl: rasaUrl,
          socketPath: "/socket.io/",
          title: "Vexa",
          subtitle: "AI Customer Assistant",
          showFullScreenButton: true,
          showCloseButton: true,
          params: {
            storage: "session",
            backgroundColor: "#ffffff",
            headerColor: "#4f46e5",
            primaryColor: "#4f46e5",
            secondaryColor: "#eef2ff",
            textColor: "#111827",
            userTextColor: "#1e1b4b",
            assistantBubbleColor: "#f3f4f6",
            inputColor: "#ffffff",
            inputBorderColor: "#e5e7eb"
          },
	  socketOptions: { transports: ["polling"] }
          // customData: { language: "en" },
        },
        null
      );
    }

    // Try jsDelivr, then unpkg as fallback
    (function loadWidget() {
      const s1 = document.createElement("script");
      s1.src = "https://cdn.jsdelivr.net/npm/rasa-webchat@1.0.1/lib/index.js";
      s1.async = true;
      s1.onload = boot;
      s1.onerror = function() {
        console.warn("jsDelivr failed, trying unpkg…");
        const s2 = document.createElement("script");
        s2.src = "https://unpkg.com/rasa-webchat@1.0.1/lib/index.js";
        s2.async = true;
        s2.onload = boot;
        s2.onerror = () => console.error("Failed to load rasa-webchat from both CDNs");
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    })();
  </script>
</body>
</html>
