#### End-to-end test stories — all intents/actions must exist in domain.yml

stories:

- story: greet and goodbye
  steps:
  - user: |
      hello
    intent: greet
  - action: utter_greet
  - user: |
      bye
    intent: goodbye
  - action: utter_goodbye

- story: bot challenge
  steps:
  - user: |
      are you a bot?
    intent: bot_challenge
  - action: utter_iamabot

- story: ask order status without order id
  steps:
  - user: |
      where is my order?
    intent: ask_order_status
  - action: order_status_form
  - active_loop: order_status_form

- story: talk to human escalation
  steps:
  - user: |
      I want to speak with a real person
    intent: talk_to_human
  - action: action_escalate_to_human

- story: refund policy inquiry
  steps:
  - user: |
      what is your refund policy?
    intent: refund_policy
  - action: utter_refund_policy

- story: shipping times inquiry
  steps:
  - user: |
      how long does shipping take?
    intent: shipping_times
  - action: utter_shipping_times

- story: out of scope general
  steps:
  - user: |
      can you recommend a good movie?
    intent: out_of_scope_general
  - action: utter_out_of_scope

- story: product positive feedback
  steps:
  - user: |
      I love this product!
    intent: product_feedback_positive
  - action: utter_thanks_positive_feedback
