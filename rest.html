<!doctype html>
<html><head><meta charset="utf-8"><title>REST Chat</title>
<style>body{font:14px/1.4 system-ui,Arial;margin:0}#log{height:80vh;overflow:auto;padding:12px;background:#f7f7f7}#bar{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}input{flex:1;padding:10px}</style>
</head>
<body>
<div id="log"></div>
<div id="bar"><input id="msg" placeholder="Type..." autocomplete="off"><button id="send">Send</button></div>
<script>
const log=document.getElementById('log'); const msg=document.getElementById('msg'); const send=document.getElementById('send');
const sender='u1';
function add(who,text){const p=document.createElement('div');p.textContent=who+': '+text;log.appendChild(p);log.scrollTop=log.scrollHeight;}
send.onclick=async()=>{
  const text=msg.value.trim(); if(!text) return; add('You',text); msg.value='';
  const r=await fetch('http://127.0.0.1:5005/webhooks/rest/webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender, message:text})});
  const j=await r.json(); if(!Array.isArray(j)||!j.length){add('Bot','(no response)'); return;}
  j.forEach(m=>add('Bot', m.text || JSON.stringify(m)));
};
</script></body></html>
