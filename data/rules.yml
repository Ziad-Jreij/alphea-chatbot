version: "3.1"

rules:

# --- Core Conversation Flow Rules ---

- rule: Greet with menu
  steps:
    - intent: greet
    # - action: action_infer_emotion
    - action: utter_greet
    - action: utter_welcome_menu

- rule: Goodbye
  steps:
    - intent: goodbye
    # - action: action_infer_emotion
    - action: utter_goodbye
# --- Simple Intent-Response Rules ---

- rule: Respond to Shipping times
  steps:
    - intent: shipping_times
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_shipping_times

- rule: Respond to Store hours
  steps:
    - intent: store_hours
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_store_hours

- rule: Respond to Refund policy
  steps:
    - intent: refund_policy
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_faq_refund_window

- rule: Respond to contact channels FAQ
  steps:
    - intent: faq_contact_channels
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_faq_contact_channels

- rule: Handle generic FAQ intent
  steps:
    - intent: faq
    - action: utter_faq

# --- Handoff Rules ---

- rule: Human handoff
  steps:
    - intent: talk_to_human
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_request_handoff
    - action: utter_handoff_ack

- rule: Urgent goes to human
  steps:
    - intent: urgent_contact
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_request_handoff
    - action: utter_handoff_ack

# --- Fallback and Uncertainty Rules (Consolidated) ---
- rule: NLU fallback (soft)
  steps:
    - intent: nlu_fallback
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_default
    - action: action_mark_fallback
    - action: action_soft_affirmation

- rule: Fallback confirmed
  steps:
    - action: action_soft_affirmation
    - intent: affirm
    - action: action_revert_fallback_events

- rule: Fallback to email lookup if user doesn’t have order ID
  condition:
    - active_loop: return_form
  steps:
    - slot_was_set:
        - order_id: null
    - action: action_lookup_order_status_by_email
- rule: Fallback rejected
  steps:
    - action: action_soft_affirmation
    - intent: deny
    - action: action_default_ask_rephrase

# --- Form Activation Rules ---

- rule: Activate order status form
  steps:
    - intent: ask_order_status
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: order_status_form
    - active_loop: order_status_form

- rule: Activate cancel order form
  steps:
    - intent: cancel_order
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_clear_context
    - action: cancel_order_form
    - active_loop: cancel_order_form

# --- Form Submission Rules ---

- rule: Submit order status form
  condition:
    - active_loop: order_status_form
  steps:
    - action: order_status_form
    - active_loop: null
    - action: action_lookup_order_status
    - action: utter_ask_conversation_feedback
    - action: action_listen

- rule: Submit password reset form
  condition:
    - active_loop: password_reset_form
  steps:
    - action: password_reset_form
    - active_loop: null
    - action: action_password_reset
    - action: utter_ask_conversation_feedback
    - action: action_listen
- rule: Activate return form
  steps:
    - intent: start_return
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: return_form
    - active_loop: return_form
- rule: Submit return form
  condition:
    - active_loop: return_form
  steps:
    - action: return_form
    - active_loop: null
    - action: action_start_return
    - action: utter_ask_conversation_feedback
    - action: action_listen

- rule: Submit cancel order form
  condition:
    - active_loop: cancel_order_form
  steps:
    - action: cancel_order_form
    - active_loop: null
    - action: action_cancel_order
    - action: utter_ask_conversation_feedback
    - action: action_listen

- rule: Submit address update form
  condition:
    - active_loop: address_update_form
  steps:
    - action: address_update_form
    - active_loop: null
    - action: action_update_address
    - action: utter_ask_conversation_feedback
    - action: action_listen
- rule: Ask if user needs more help after a form
  condition:
    - active_loop: null
  steps:
    - action: utter_ask_anything_else
    - action: utter_ask_more_help
# --- Form Interruption Rules (Examples) ---

- rule: Interrupt form for human handoff
  condition:
    - active_loop: password_reset_form
  steps:
    - intent: talk_to_human
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: action_request_handoff
    - action: utter_handoff_ack

- rule: Interrupt reset form for order status
  condition:
    - active_loop: password_reset_form
  steps:
    - intent: ask_order_status
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_status_form
    - active_loop: order_status_form

- rule: Interrupt reset form for damage report
  condition:
    - active_loop: password_reset_form
  steps:
    - intent: report_damaged_product
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: utter_ack_damage
    - action: damage_report_form
    - active_loop: damage_report_form
# While asking for order_id, allow switching to email lookup
- rule: No order ID → look up by email
  condition:
    - active_loop: address_update_form
  steps:
    - intent: no_order_id
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_lookup_by_email_form
    - active_loop: order_lookup_by_email_form
# --- Order status: no order ID → email lookup ---
- rule: No order ID (order status) → look up by email
  condition:
    - active_loop: order_status_form
  steps:
    - intent: no_order_id
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_lookup_by_email_form
    - active_loop: order_lookup_by_email_form

# --- Cancel order: no order ID → email lookup ---
- rule: No order ID (cancel order) → look up by email
  condition:
    - active_loop: cancel_order_form
  steps:
    - intent: no_order_id
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_lookup_by_email_form
    - active_loop: order_lookup_by_email_form

# --- Damage report: no order ID → email lookup ---
- rule: No order ID (damage report) → look up by email
  condition:
    - active_loop: damage_report_form
  steps:
    - intent: no_order_id
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_lookup_by_email_form
    - active_loop: order_lookup_by_email_form

# Return form: switch to email lookup
- rule: Return → no order ID → look up by email
  condition:
    - active_loop: return_form
  steps:
    - intent: no_order_id
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_clear_context
    - action: order_lookup_by_email_form
    - active_loop: order_lookup_by_email_form
- rule: Submit email lookup form
  condition:
    - active_loop: order_lookup_by_email_form
  steps:
    - action: order_lookup_by_email_form
    - active_loop: null
    - action: action_lookup_order_status_by_email
- rule: Handle chitchat 
  steps:
    - intent: chitchat
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_chitchat
- rule: Submit damage report
  condition:
    - active_loop: damage_report_form
  steps:
    - action: damage_report_form
    - active_loop: null
    - action: action_record_damage_ticket   # your custom submit action
    - action: utter_ask_conversation_feedback
    - action: action_listen
# ADDRESS UPDATE (has saved order)
- rule: Address update with existing order → confirm reuse
  condition:
    - slot_was_set:
        - order_id: true
  steps:
    - intent: update_address
    - action: confirm_reuse_address_form
    - active_loop: confirm_reuse_address_form

- rule: Submit reuse confirm → address form
  condition:
    - active_loop: confirm_reuse_address_form
  steps:
    - action: confirm_reuse_address_form
    - active_loop: null
    - action: action_after_reuse_confirm
    - action: address_update_form
    - active_loop: address_update_form

# ADDRESS UPDATE (no order saved yet) — keep your existing activation rule
- rule: Address update (no saved order)
  condition:
    - slot_was_set:
        - order_id: null
  steps:
    - intent: update_address
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_clear_context
    - action: address_update_form
    - active_loop: address_update_form

# DAMAGE (has saved order)
- rule: Damage report with existing order → confirm reuse
  condition:
    - slot_was_set:
        - order_id: true
  steps:
    - intent: report_damaged_product
    - action: confirm_reuse_damage_form
    - active_loop: confirm_reuse_damage_form

- rule: Submit reuse confirm → damage form
  condition:
    - active_loop: confirm_reuse_damage_form
  steps:
    - action: confirm_reuse_damage_form
    - active_loop: null
    - action: action_after_reuse_confirm
    - action: utter_ack_damage
    - action: damage_report_form
    - active_loop: damage_report_form

# DAMAGE REPORT (no order saved yet) — keep your existing activation rule
- rule: Start damage report (no saved order)
  condition:
    - slot_was_set:
        - order_id: null
  steps:
    - intent: report_damaged_product
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_clear_context
    - action: utter_ack_damage
    - action: damage_report_form
    - active_loop: damage_report_form
- rule: Positive product feedback
  steps:
    - intent: product_feedback_positive
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_ack_positive_feedback
    - action: utter_welcome_menu

- rule: Negative product feedback
  steps:
    - intent: product_feedback_negative
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_ack_negative_feedback
    - action: utter_welcome_menu
- rule: Handle out of scope (general)
  steps:
    - intent: out_of_scope_general
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_oos_generic
    - action: utter_welcome_menu
- rule: Handle out of scope (personal distress)
  steps:
    - intent: out_of_scope_personal_distress
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: utter_oos_personal_condolences
    - action: utter_welcome_menu
- rule: Handle conversation feedback and export
  steps:
    - intent: give_conversation_feedback
    - action: action_store_feedback_and_export
    - action: action_listen
- rule: Offer human handoff when potential escalation
  condition:
    - slot_was_set:
        - escalation: "potential"
  steps:
    - action: action_offer_handoff
# When per-turn criticality says escalate_now
- rule: Escalate now when high criticality
  condition:
    - slot_was_set:
        - escalation: "escalate_now"
  steps:
    - action: utter_show_empathy
    - action: utter_escalation_banner
    - action: action_escalate_now


# When conversation-level risk says escalate_now
- rule: Escalate now when conversation-level says so
  condition:
    - slot_was_set:
        - conversation_escalation: escalate_now
  steps:
    - action: utter_show_empathy
    - action: utter_escalation_banner
    - action: action_escalate_now
# When conversation-level risk is "potential" → gentle empathy + offer handoff
- rule: Offer handoff when conversation-level is potential
  condition:
    - slot_was_set:
        - conversation_escalation: potential
  steps:
    - action: utter_show_empathy
    - action: utter_escalation_banner
    - action: action_offer_handoff
- rule: Ask for order_id in order status form
  condition:
    - active_loop: order_status_form
  steps:
    - action: utter_ask_order_id
- rule: Ask for new_address in address update form
  condition:
    - active_loop: address_update_form
  steps:
    - action: utter_ask_new_address
- rule: Ask for lookup_email
  condition:
    - active_loop: order_lookup_by_email_form
  steps:
    - action: utter_ask_lookup_email
- rule: Ask for return_reason
  condition:
    - active_loop: return_form
  steps:
    - action: utter_ask_return_reason
- rule: Ask reuse_ok for address confirm
  condition:
    - active_loop: confirm_reuse_address_form
  steps:
    - action: utter_ask_reuse_ok

- rule: Ask reuse_ok for damage confirm
  condition:
    - active_loop: confirm_reuse_damage_form
  steps:
    - action: utter_ask_reuse_ok
# Ask for email in password reset form
- rule: Ask for email during password reset
  condition:
    - active_loop: password_reset_form
  steps:
    - action: utter_ask_email

# Ask for email in order lookup-by-email form
- rule: Ask for lookup_email during order lookup by email
  condition:
    - active_loop: order_lookup_by_email_form
  steps:
    - action: utter_ask_email
    # Ask for issue_description in damage report form
- rule: Ask for issue description during damage report
  condition:
    - active_loop: damage_report_form
  steps:
    - action: utter_ask_issue_description
# Ask for confirmation before cancel order
- rule: Ask to confirm cancel during cancel order form
  condition:
    - active_loop: cancel_order_form
  steps:
    - action: utter_ask_confirm_cancel
# Invalid email while in password_reset_form
- rule: Invalid email during password reset
  condition:
    - active_loop: password_reset_form
  steps:
    - intent: nlu_fallback
    - action: utter_email_invalid

# Invalid email while in order_lookup_by_email_form
- rule: Invalid email during lookup-by-email form
  condition:
    - active_loop: order_lookup_by_email_form
  steps:
    - intent: nlu_fallback
    - action: utter_email_invalid
# Invalid order ID while checking order status
- rule: Invalid order ID during order status form
  condition:
    - active_loop: order_status_form
  steps:
    - intent: nlu_fallback
    - action: utter_order_id_invalid

# Invalid order ID while reporting damage
- rule: Invalid order ID during damage report form
  condition:
    - active_loop: damage_report_form
  steps:
    - intent: nlu_fallback
    - action: utter_order_id_invalid
- rule: Activate password reset form
  steps:
    - intent: reset_password
    - action: action_set_primary_intent
    - action: action_infer_emotion
    - action: action_update_conversation_risk
    - action: action_clear_context
    - action: password_reset_form
    - active_loop: password_reset_form
# After order status is resolved or failed
- rule: Export summary after order lookup
  steps:
    - action: action_lookup_order_status
    - action: action_export_conversation_summary

# After order lookup by email
- rule: Export summary after order lookup by email
  steps:
    - action: action_lookup_order_status_by_email
    - action: action_export_conversation_summary

# After password reset flow
- rule: Export summary after password reset
  steps:
    - action: action_password_reset
    - action: action_export_conversation_summary

# After return flow
- rule: Export summary after start_return
  steps:
    - action: action_start_return
    - action: action_export_conversation_summary

# After cancel order flow
- rule: Export summary after cancel order
  steps:
    - action: action_cancel_order
    - action: action_export_conversation_summary

# After address update
- rule: Export summary after address update
  steps:
    - action: action_update_address
    - action: action_export_conversation_summary

# After damage report / ticket creation
- rule: Export summary after damage report
  steps:
    - action: action_record_damage_ticket
    - action: action_export_conversation_summary

# After escalation to human
- rule: Export summary after escalation
  steps:
    - action: action_escalate_now
    - action: action_export_conversation_summary
