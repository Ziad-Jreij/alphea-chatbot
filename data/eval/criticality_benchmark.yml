# Criticality benchmark — labelled customer-service messages.
#
# Used by eval_criticality.py. Not training data: nothing here is seen by the
# model or the guardrails during development, so keep it that way (don't copy
# these sentences into nlu.yml or criticality_keywords.yml).
#
# LABELLING RUBRIC
#   high    A human should step in now. Physical safety or injury risk; medical
#           risk; fraud, account takeover or unauthorised money movement;
#           privacy/data exposure or legal demands (GDPR, legal action,
#           chargebacks); severe financial loss; vulnerable customer at risk;
#           repeated unresolved failures with strong distress.
#   medium  A real problem that needs action, but no immediate harm: late,
#           missing, wrong or damaged items; refund/billing errors without
#           fraud; non-safety defects; account access trouble; poor service.
#   low     Information requests, how-to, praise, routine changes, and
#           hypothetical or hearsay concerns with no actual incident.
#
# source:  thesis  original 40-case set from the thesis evaluation
#          draft   added in Phase 2 (2026-10), drafted by Claude Code —
#                  NEEDS HUMAN REVIEW before results are quoted externally
# tags:    trap categories, reported separately by the eval script
#          negation, hearsay, question, contrast, safety_word, repeated

