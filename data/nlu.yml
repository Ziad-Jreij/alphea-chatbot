version: "3.1"
nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - hey there
    - good morning
    - good evening
    - hey bot

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - talk to you later
    - adios 
    - see you 
    - talk later
- intent: affirm
  examples: |
    - yes
    - yep
    - correct
    - that's right
    - sure
- intent: deny
  examples: |
    - no
    - nope
    - not really
    - wrong
    - absolutely not

- intent: ask_order_status
  examples: |
    - where is my order [ORD-12345](order_id)?
    - track order [ORD-98765](order_id)
    - order status please
    - can you check my order?
    - what's the status of my order?
    - check order [1234](order_id)
    - can you track my parcel?
    - order tracking
    - check my order
    - what is the status of my order?
    - where is my package right now?
    - is my order [998877](order_id) shipped yet?
    - can you check on my order please?
    - track my delivery
    - how long until my items arrive?
    - update on order [123-456](order_id)
    - has my order been processed?
    - tell me about the delivery of order [741852](order_id)
    - is my item out for delivery?
    - please check my order
    - where is my stuff?
    - where’s my order?
    - where is my order
    - can you track my order
    - track my shipment
    - check delivery status
- intent: reset_password
  examples: |
    - I forgot my password
    - reset my password
    - help me recover my account
    - my email is [alex@example.com](email)
    - I need to change my password

- intent: report_damaged_product
  examples: |
    - my product is damaged
    - my order came defective
    - item arrived faulty
    - I want to report a damaged product
    - I received a broken item
    - the package arrived damaged
    - product is faulty
    - damaged delivery

- intent: start_return
  examples: |
    - I want to return my order
    - start a return
    - request a refund
    - return item
    - how do I send something back?
    - initiate a return
    - I want to return an item.
    - can I send back a product?
    - I need to start a return
    - how do I return my purchase?
    - where do I go to return something?
    - I would like to initiate a product return.
    - start a return for order [12345678](order_id)
    - I am unhappy and want to send my goods back.
    - I need help with returning my order.
    - begin the return procedure please
    - let me return a product.
    - I need to send back order [ORDER-ABCD](order_id)

- intent: cancel_order
  examples: |
    - cancel my order
    - can I cancel my order
    - I want to stop this order
    - please cancel order
    - I need to stop the shipment

- intent: update_address
  examples: |
    - change my shipping address
    - update delivery address
    - wrong address on my order
    - I moved, update address
    - need to change the delivery location

- intent: talk_to_human
  examples: |
    - I need a human
    - can I talk to an agent?
    - escalate me to support
    - get me a person
    - connect me with a representative

- intent: urgent_contact
  examples: |
    - this is urgent
    - need immediate help
    - very urgent
    - escalate now
    - critical problem

# --- FAQ Intents (Standardized to use 'faq/' prefix) ---
- intent: refund_policy
  examples: |
    - what's your refund policy?
    - can I get a refund?
    - return policy please
    - what is your refund period?
    - how long do I have to return?
    - refund period
    - what is your refund policy?
    - tell me about refunds
    - how long do I have to request a refund?
    - what are the guidelines for getting my money back?
    - is it possible to get a refund?
    - what's the refund window?
    - what are the terms for a refund?
    - do you offer a money-back guarantee?
    - can I get my payment reversed?
    - what's the procedure for a refund?
    - I need to know the official refund rules.
    - what is the deadline to ask for a refund?

- intent: shipping_times
  examples: |
    - how long does shipping take?
    - when will my order arrive?
    - delivery time estimate
    - how long is shipping
    - when will it arrive

- intent: store_hours
  examples: |
    - what are your hours
    - when are you open
    - support hours
    - what time does your support team start?

- intent: faq/contact_channels
  examples: |
    - how can I contact support?
    - do you have live chat?
    - customer service phone?
    - what are your contact channels?

