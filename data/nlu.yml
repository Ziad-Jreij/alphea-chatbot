# --- RegEx and Lookup Tables ---
- regex: order_id
  examples: |
    - ORD-\d{5}
    - \d{5} # Added numeric-only ID pattern
- regex: email
  examples: |
    - [^@]+@[^@]+\.[^@]+

- lookup: product
  examples: |
    - premium plan
    - basic plan
    - family plan
    - enterprise plan
    - widget pro
    - widget mini

- synonym: refund
  examples: |
    - return
    - money back
    - reimbursement
    - exchange
