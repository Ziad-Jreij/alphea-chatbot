<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alphea — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4f46e5;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
    }

    .logo span {
      font-size: 12px;
      color: #6b7280;
      font-weight: 400;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }

    .field { margin-bottom: 18px; }

    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover  { background: #4338ca; }
    button[type="submit"]:active { background: #3730a3; }
    button[type="submit"]:disabled { background: #a5b4fc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-dot"></div>
      <div>
        <h1>Alphea Dashboard</h1>
        <span>Agent Command Center</span>
      </div>
    </div>

    <div class="error" id="error-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="admin" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const API_BASE = "http://localhost:5001";

    // If already logged in, skip the login page
    if (localStorage.getItem("authToken")) {
      location.href = "dashboard.html";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn     = document.getElementById("submit-btn");
      const errBox  = document.getElementById("error-msg");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled    = true;
      btn.textContent = "Signing in…";
      errBox.style.display = "none";

      try {
        const res  = await fetch(`${API_BASE}/api/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.access_token) {
          localStorage.setItem("authToken", data.access_token);
          location.href = "dashboard.html";
        } else {
          errBox.textContent   = data.error || "Login failed. Check your credentials.";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.textContent   = "Cannot reach the dashboard server. Is it running?";
        errBox.style.display = "block";
      } finally {
        btn.disabled    = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
