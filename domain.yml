version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - ask_order_status
  - reset_password
  - refund_policy
  - talk_to_human
  - faq
  - report_damaged_product
  - nlu_fallback
  - urgent_contact
  - start_return
  - cancel_order
  - update_address
  - shipping_times
  - store_hours
  - chitchat
  - no_order_id
  - product_feedback_positive
  - product_feedback_negative
  - out_of_scope_general
  - out_of_scope_personal_distress
  - faq_contact_channels
  - give_conversation_feedback
entities:
  - order_id
  - email
  - new_address
  - return_reason
  - confirm_cancel
  - sentiment
  - top_emotion
  - criticality_level
  - criticality_score
  - escalation
  - last_soft_affirmation_ts
  - conversation_feedback

slots:
  conversation_feedback:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: conversation_feedback
        intent: give_conversation_feedback
    ################ DATASET 1 <|>
  export_done:
    type: bool
    influence_conversation: false
    initial_value: false
    mappings:
      - type: custom  
  session_start_time:
    type: text
    influence_conversation: false
    mappings: [{ type: custom }]

  primary_intent:
    type: text
    influence_conversation: false
    mappings: [{ type: custom }]

  resolution_status:
    type: text
    influence_conversation: false
    mappings: [{ type: custom }]

  final_sentiment:
    type: text
    influence_conversation: false
    mappings: [{ type: custom }]

  handoff_requested:
    type: bool
    influence_conversation: false
    mappings: [{ type: custom }]
  overall_emotion:
    type: text
    influence_conversation: false
    mappings: [{ type: custom }]
  emotion_tally:
    type: any        
    influence_conversation: false
    mappings: [{ type: custom }]
  sentiment:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: sentiment
  emotion_history:
    type: list            
    influence_conversation: false
    mappings: [{ type: custom }]
  top_emotion:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: top_emotion
  criticality_level:
    type: categorical
    values:
      - low
      - medium
      - high
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: criticality_level

  criticality_score:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: criticality_score
  escalation:
    type: categorical
    values:
      - none
      - potential
      - escalate_now
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: escalation
  criticality_history:
    type: list
    influence_conversation: false
    mappings: [{ type: custom }]

  criticality_tally:
    type: any
    influence_conversation: false
    mappings: [{ type: custom }]

  conversation_criticality:
    type: categorical
    values: ["low","medium","high"]
    influence_conversation: true
    mappings: [{ type: custom }]

  conversation_criticality_score:
    type: float
    influence_conversation: false
    mappings: [{ type: custom }]
    
  conversation_escalation:
    type: categorical
    values:
      - none
      - potential
      - escalate_now
    influence_conversation: true
    mappings: [{ type: custom }]
  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_status_form
            requested_slot: order_id
          - active_loop: return_form
            requested_slot: order_id
          - active_loop: cancel_order_form
            requested_slot: order_id
          - active_loop: address_update_form
            requested_slot: order_id
          - active_loop: damage_report_form
            requested_slot: order_id
      - type: from_intent
        value: "NO_ORDER_ID"
        intent: no_order_id
        conditions:
          - active_loop: order_status_form
            requested_slot: order_id
  reuse_ok:
    type: categorical
    values: ["yes", "no"]
    mappings:
      - type: from_text
        conditions:
          - active_loop: confirm_reuse_address_form
            requested_slot: reuse_ok
          - active_loop: confirm_reuse_damage_form
            requested_slot: reuse_ok
  email:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: email
      - type: from_text
        conditions:
          - active_loop: password_reset_form
            requested_slot: email
  lookup_email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: order_lookup_by_email_form
            requested_slot: lookup_email
  new_address:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: address_update_form
            requested_slot: new_address
  confirm_cancel:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        value: true
        intent: affirm
        conditions:
          - active_loop: cancel_order_form
            requested_slot: confirm_cancel
      - type: from_intent
        value: false
        intent: deny
        conditions:
          - active_loop: cancel_order_form
            requested_slot: confirm_cancel
  return_reason:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: return_form
            requested_slot: return_reason
  last_soft_affirmation_ts:
    type: text
    mappings:
      - type: from_entity
        entity: last_soft_affirmation_ts   # harmless, never set by NLU
  issue_description: 
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: damage_report_form
            requested_slot: issue_description
responses:
  #get conversation feedback via emojies
  utter_ask_conversation_feedback:
    - text: "Your feedback is incredibly important to us, how was this chat?"
      buttons:
        - title: "😡 Very bad"
          payload: '/give_conversation_feedback{"conversation_feedback": "very_bad"}'
        - title: "🙁 Bad"
          payload: '/give_conversation_feedback{"conversation_feedback": "bad"}'
        - title: "😐 Okay"
          payload: '/give_conversation_feedback{"conversation_feedback": "neutral"}'
        - title: "🙂 Good"
          payload: '/give_conversation_feedback{"conversation_feedback": "good"}'
        - title: "🤩 Excellent"
          payload: '/give_conversation_feedback{"conversation_feedback": "excellent"}'
  # Main Conversation Responses
  utter_ack_positive_feedback:
    - text: >
        That’s wonderful to hear! 😊 I’m really glad the product is working well for you.
        If you’d like, I can also help you with anything related to your orders, returns,
        or account.
      buttons:
        - title: "Track my order"
          payload: "/ask_order_status"
        - title: "Start a return"
          payload: "/start_return"
        - title: "Talk to a human"
          payload: "/talk_to_human"

  utter_ack_negative_feedback:
    - text: >
        I’m really sorry that your experience hasn’t been great. Thank you for sharing this—
        it helps us improve. Let’s decide together what you’d like to do next.
      buttons:
        - title: "Report a damaged product"
          payload: "/report_damaged_product"
        - title: "Start a return / refund"
          payload: "/start_return"
        - title: "Talk to a human"
          payload: "/talk_to_human"

  utter_show_empathy:
    - text: >
        I’m really sorry this has been frustrating. Your issue matters, and I’m here to help
        you sort it out step by step.

  utter_ask_more_help:
    - text: "Is there anything else I can help you with right now?"

  utter_ask_lookup_email:
    - text: >
        No problem, we can search by email instead. Which email address did you use
        when placing the order?

  utter_ask_reuse_ok:
    - text: >
        I see you have a recent order {order_id}. Is this the order you’re asking about,
        or is it for a different one?
      buttons:
        - title: "Yes, same order"
          payload: "yes"
        - title: "No, different order"
          payload: "no"

  utter_ask_anything_else:
    - text: "Is there anything else you’d like me to help you with today?"

  utter_welcome_menu:
    - text: >
        Let me know how I can assist you.
      buttons:
        - title: "Track my order"
          payload: "/ask_order_status"
        - title: "Report damaged product"
          payload: "/report_damaged_product"
        - title: "Start a return / refund"
          payload: "/start_return"
        - title: "Update shipping address"
          payload: "/update_address"
        - title: "Cancel an order"
          payload: "/cancel_order"
        - title: "Reset my password"
          payload: "/reset_password"
        - title: "Contact options & hours"
          payload: "/faq_contact_channels"
        - title: "Talk to a human"
          payload: "/talk_to_human"

  utter_greet:
    - text: >
        Hello! I’m Aletheia, your virtual customer service assistant. 🌿
        You can choose an option below or simply tell me what you’d like to do,
        like “track my order” or “I want to return an item”.

  utter_goodbye:
    - text: >
        Thanks for reaching out today. If you need anything else later, I’ll be here.
        Have a great day! ✨

  utter_handoff_ack:
    - text: >
        Got it. I’ll connect you to a human agent now. Please stay in the chat —
        they’ll review this conversation so you don’t have to repeat everything.

  utter_ack_damage:
    - text: >
        I’m really sorry your item arrived in poor condition. Let’s file a quick
        damage report so we can fix this for you as soon as possible.

  # Prompts (Forms)
  utter_ask_order_id:
    - text: >
        Sure — what is your order ID? (for example, ORD-12345)
      buttons:
        - title: "I don't have it"
          payload: "/no_order_id"

  utter_ask_email:
    - text: "Sure thing! Just share the email you used for your order and I’ll track it down for you. 🔎🛍️"
      # buttons:
      #   - title: "Use a different email"
      #     payload: "/deny"

  utter_ask_issue_description:
    - text: >
        Please describe the damage in a few words (for example: “broken screen”,
        “dented corner”, or “missing parts”). This helps the support team act faster.

  utter_ask_new_address:
    - text: >
        Please provide the new full shipping address, including street, city,
        postal code, and country.

  utter_ask_return_reason:
    - text: >
        What is the main reason for your return? (for example: changed mind,
        damaged item, wrong item received, doesn’t fit, etc.)

  utter_ask_confirm_cancel:
    - text: "Are you sure you want to cancel this order?"
      buttons:
        - title: "Yes, cancel it"
          payload: "/affirm"
        - title: "No, keep it"
          payload: "/deny"

  # Validation Errors
  utter_order_id_invalid:
    - text: >
        That doesn’t look like a valid order ID (for example, ORD-12345).
        Please double-check it and try again.

  utter_email_invalid:
    - text: >
        That doesn’t look like a valid email address. Please enter a valid email
        (for example, name@example.com).

  # Fallback
  utter_default:
    - text: >
        I’m not sure I understood that correctly. Could you rephrase it, or choose one
        of the options below so I can guide you?
      buttons:
        - title: "Track my order"
          payload: "/ask_order_status"
        - title: "Start a return / refund"
          payload: "/start_return"
        - title: "Report damaged product"
          payload: "/report_damaged_product"
        - title: "Talk to a human"
          payload: "/talk_to_human"

  # FAQs (Retrieval Intents & Generic FAQ)
  utter_faq:
    - text: >
        I can help you with shipping times, store hours, contact options, and our refund
        policy. What would you like to know?
      buttons:
        - title: "Refund & return policy"
          payload: "/refund_policy"
        - title: "Shipping times"
          payload: "/shipping_times"
        - title: "Store & support hours"
          payload: "/store_hours"
        - title: "Contact channels"
          payload: "/faq_contact_channels"

  utter_faq_refund_window:
    - text: >
        Our standard refund and return period is 14 days from the delivery date, as long
        as the item is in its original condition (unless local regulations provide additional
        rights).  
        If you’d like, I can help you start a return or connect you to a human agent.
      buttons:
        - title: "Start a return"
          payload: "/start_return"
        - title: "Talk to a human"
          payload: "/talk_to_human"

  utter_faq_contact_channels:
    - text: 
        "You can reach our support team in several ways:\n
        • Live chat: 09:00–18:00 EET \n 
        • Email: support@company.com  \n 
        • Phone: +357-XXXXXXX  \n

        If you tell me what you need, I can also try to handle it directly here in the chat."

  utter_store_hours:
    - text: >
        Our customer support team is available Monday to Friday, from 09:00 to 18:00 EET.
        You can still leave a message outside these hours, and someone will follow up.

  utter_shipping_times:
    - text: >
        Standard shipping usually takes 3–5 business days after dispatch.  
        Express shipping (where available) typically arrives within 1–2 business days.
        Actual times may vary slightly depending on your location and carrier.

  # Chitchat
  utter_chitchat/ask_howareyou:
    - text: >
        I’m doing great, thank you for asking! 😊  
        How can I help you today — do you want to check an order, report an issue,
        or ask about something else?

  utter_chitchat/thanks:
    - text: "You’re very welcome! If you need anything else, just let me know. 💬"

  utter_chitchat/ask_name:
    - text: >
        I’m Aletheia, your virtual customer service assistant. I’m here to help you with
        orders, returns, and account questions.

  utter_oos_generic:
    - text: >
        That’s an interesting question, but it’s outside what I can help with.  
        I’m designed to assist with orders, deliveries, returns, product issues,
        and account questions.  
        If you’d like, tell me what you need help with in one of those areas.

  utter_oos_personal_condolences:
    - text: >
        I’m really sorry you’re going through something so difficult. 💛  
        I’m not able to fully support personal or emotional situations, but if there’s
        anything practical I can do for your order or account, I’m here to help.

  # Distress / Crisis Guidance (non-clinical, supportive)
  utter_crisis_help:
    - text: >
        I’m truly sorry that you’re feeling this way. Your well-being is very important.  
        If you might be in danger or thinking about harming yourself, please contact local
        emergency services or a trusted person immediately.  
        If you have access to a mental health hotline or professional support, reaching out
        to them could really help.  
        When you’re ready, I can still assist you with any order or account tasks here.

  utter_acknowledge_critical_issue:
    - text: >
        I understand — this sounds serious and important. I’m going to prioritize your
        case and make sure it’s handled with extra care.

  utter_escalation_banner:
    - text: >
        I’m escalating this conversation to a human specialist so you can get dedicated
        support. Please stay online — they’ll join you as soon as possible.

actions:
  - action_infer_emotion
  - action_lookup_order_status
  - action_password_reset
  - action_record_damage_ticket
  - action_clear_context
  - action_request_handoff
  - validate_order_status_form
  - validate_return_form
  - action_start_return
  - action_cancel_order
  - action_update_address
  - validate_cancel_order_form
  - validate_address_update_form
  - validate_password_reset_form
  - validate_damage_report_form   
  - validate_order_lookup_by_email_form
  - action_lookup_order_status_by_email
  - action_soft_affirmation
  - validate_confirm_reuse_address_form
  - validate_confirm_reuse_damage_form
  - action_after_reuse_confirm
  - action_escalate_now
  - action_offer_handoff
  - action_update_conversation_risk
  - action_session_start
  - action_set_primary_intent
  - action_export_conversation_summary
  - action_mark_fallback
  - action_store_feedback_and_export

forms:
  confirm_reuse_address_form:
    required_slots: [reuse_ok]
  confirm_reuse_damage_form:
    required_slots: [reuse_ok]
  order_lookup_by_email_form:
    required_slots: [lookup_email]
  damage_report_form:
    required_slots:
      - order_id
      - issue_description
  order_status_form:
    required_slots:
      - order_id
  password_reset_form:
    required_slots:
      - email
  return_form:
    required_slots: [order_id, return_reason]
  cancel_order_form:
    required_slots: [order_id, confirm_cancel]
  address_update_form:
    required_slots: [order_id, new_address]


session_config:
  session_expiration_time: 180  # or whatever you use
  carry_over_slots_to_new_session: true