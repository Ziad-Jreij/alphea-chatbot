# Chat channels the Rasa server exposes.
# More channels (Slack, Facebook, Telegram, ...):
# https://rasa.com/docs/rasa/messaging-and-voice-channels

# POST /webhooks/rest/webhook — used by scripts/record_test_stories.py
rest:

# Socket.IO — used by the web chat widget (webchat/*.html)
socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: true
  cors_allowed_origins:
    # In production, set RASA_CORS_ORIGINS to your site, e.g. https://shop.example.com
    - "${RASA_CORS_ORIGINS:-*}"
