name: Release

# Push a tag like v1.0.0 to publish:
#   - Docker images to GHCR: ghcr.io/<owner>/alphea-{rasa,actions,dashboard}:<version> and :latest
#   - a trained Rasa model attached to the GitHub release as alphea-model.tar.gz,
#     which scripts/setup.sh downloads so users can skip training
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [rasa, actions, dashboard]
    steps:
      - uses: actions/checkout@v4

      # The Rasa base image alone is ~4.8 GB; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alphea-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  model:
    name: Train and attach model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RASA_IMAGE: rasa/rasa:3.6.20-full
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Train
        run: |
          mkdir -p release-models
          docker run --rm --user root -v "$PWD":/app -w /app "$RASA_IMAGE" \
            train --out release-models --fixed-model-name alphea-model

      - name: Dialogue tests against the release model
        run: |
          docker run --rm --user root -v "$PWD":/app -w /app "$RASA_IMAGE" \
            test core --model release-models/alphea-model.tar.gz \
            --stories tests/test_stories.yml --out release-results --fail-on-prediction-errors

      - name: Attach to release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-models/alphea-model.tar.gz --clobber
