version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions (transformers 5, sentence-transformers 3+, ...) need a
      # deliberate upgrade and a benchmark re-run, not a bot PR.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # rasa-sdk must match the Rasa 3.6 server in docker/Dockerfile.rasa
      - dependency-name: rasa-sdk
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # Rasa Open Source is pinned to 3.6.x (Python 3.10)
      - dependency-name: rasa/rasa
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
