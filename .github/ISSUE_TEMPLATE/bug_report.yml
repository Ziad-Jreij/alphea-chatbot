name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues:** please use private vulnerability reporting (see SECURITY.md) instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: For dialogue problems, paste the conversation (user and bot turns).
      placeholder: |
        1. docker compose up -d
        2. Open http://localhost:5001/webchat.html
        3. Type "..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs rasa rasa-actions dashboard` around the problem. Remove any secrets first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Docker 27, CPU only"
